apiVersion: apps/v1
kind: Deployment
metadata:
  name: peace-international
  namespace: peace-international
spec:
  replicas: 1
  selector:
    matchLabels:
      app: peace-international
  template:
    metadata:
      labels:
        app: peace-international
    spec:
      initContainers:
      - name: wait-for-db-setup
        image: mysql:8.0
        command:
        - sh
        - -c
        - |
          PASSWORD=$(echo $CONNECTION_STRING | grep -oP 'Password=\K[^;]+')
          until mysql -h mysql.mysql.svc.cluster.local -u peace_user -p"$PASSWORD" -e "USE peace_international;" 2>/dev/null; do
            echo "Waiting for DB setup..."
            sleep 5
          done
        env:
        - name: CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: ConnectionStrings__DefaultConnection
      containers:
      - name: peace-international
        image: arjuntheguru/peace-international:latest
        ports:
        - containerPort: 8080
        envFrom:
        - secretRef:
            name: app-secret
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: Production
        - name: ASPNETCORE_URLS
          value: http://+:8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
