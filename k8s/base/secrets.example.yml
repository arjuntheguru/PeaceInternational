# Example only: the real Secrets are created on the server and never committed (the old plaintext
# values were rotated on 2026-10-20). Neither is listed in kustomization.yml, so `kubectl apply -k` leaves
# the live values alone.
#
#   app-secret            (peace-international)  ConnectionStrings__DefaultConnection, read by the app
#   peace-db-credentials  (mysql)                MYSQL_PASSWORD, read by db-setup-job.yml to create peace_user
#
# Create or rotate them on the server so the password never appears in a command line, e.g.:
#   pw=$(openssl rand -hex 24)
#   printf 'Server=mysql.mysql.svc.cluster.local;Database=peace_international;User=peace_user;Password=%s;Port=3306;' "$pw" > /tmp/conn
#   kubectl create secret generic app-secret -n peace-international --from-file=ConnectionStrings__DefaultConnection=/tmp/conn --dry-run=client -o yaml | kubectl apply -f -
#   printf %s "$pw" > /tmp/pw
#   kubectl create secret generic peace-db-credentials -n mysql --from-file=MYSQL_PASSWORD=/tmp/pw --dry-run=client -o yaml | kubectl apply -f -
#   rm -f /tmp/conn /tmp/pw
# then run ALTER USER 'peace_user'@'%' IDENTIFIED BY '<pw>' as root and restart the deployment.
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: peace-international
type: Opaque
stringData:
  ConnectionStrings__DefaultConnection: "Server=mysql.mysql.svc.cluster.local;Database=peace_international;User=peace_user;Password=<password>;Port=3306;"
---
apiVersion: v1
kind: Secret
metadata:
  name: peace-db-credentials
  namespace: mysql
type: Opaque
stringData:
  MYSQL_PASSWORD: "<password>"
