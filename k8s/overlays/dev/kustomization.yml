apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: Development
    target:
      kind: Deployment
      name: peace-international

images:
  - name: arjuntheguru/peace-international
    newTag: dev
